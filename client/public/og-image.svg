<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#070b14" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="ogGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#a855f7" stopOpacity="0.1" />
    </linearGradient>
    <filter id="ogFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  
  <!-- Subtle ambient glow orbs -->
  <circle cx="200" cy="180" r="280" fill="#38bdf8" opacity="0.18" filter="url(#ogFilter)" />
  <circle cx="1000" cy="450" r="260" fill="#a855f7" opacity="0.18" filter="url(#ogFilter)" />

  <!-- Outer frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />

  <!-- Status pill -->
  <g transform="translate(80, 80)">
    <rect width="470" height="42" rx="21" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#10b981" />
    <text x="42" y="26" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="600" fill="#c4b5fd">
      B.Tech Mathematics &amp; Computing @ RGIPT (2027)
    </text>
  </g>

  <g transform="translate(565, 80)">
    <rect width="210" height="42" rx="21" fill="#1e293b" fill-opacity="0.9" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="20" y="26" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#c084fc">
      ★ Contributed on GSoC
    </text>
  </g>

  <!-- Name -->
  <text x="80" y="210" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1px">
    Pramod Yadav
  </text>

  <!-- Title -->
  <text x="80" y="275" font-family="'Space Grotesk', system-ui, sans-serif" font-size="36" font-weight="700" fill="#60a5fa">
    Full Stack &amp; AI Developer · 3D Portfolio
  </text>

  <!-- One-line value statement -->
  <text x="80" y="345" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400">
    Engineering distributed systems, agentic AI pipelines &amp; scalable web applications.
  </text>
  <text x="80" y="380" font-family="'Inter', system-ui, sans-serif" font-size="18" fill="#94a3b8" font-weight="400">
    Contributed on GSoC · CodeChef · Codeforces · GeeksforGeeks
  </text>

  <!-- Key stats / metrics bar -->
  <g transform="translate(80, 450)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="220" height="70" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">500+ Solved</text>
    <text x="20" y="52" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#94a3b8">DSA Problems</text>

    <!-- Metric 2 -->
    <rect x="240" y="0" width="230" height="70" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">JEE Advanced</text>
    <text x="20" y="52" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#94a3b8">Top 2% Nationwide</text>

    <!-- Metric 3 -->
    <rect x="490" y="0" width="250" height="70" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Rahat &amp; BhoomiAI</text>
    <text x="20" y="52" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#94a3b8">Production AI Systems</text>

    <!-- Metric 4 -->
    <rect x="760" y="0" width="240" height="70" rx="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
    <text x="20" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#c4b5fd">github.com/Prm01</text>
    <text x="20" y="52" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#a78bfa">Open Source Contributions</text>
  </g>
</svg>
