<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b0f19" />
      <stop offset="100%" stopColor="#111827" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#8b5cf6" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#8b5cf6" stopOpacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="none" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="2" />

  <!-- Top Navigation Bar -->
  <rect x="25" y="25" width="750" height="50" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <circle cx="55" cy="50" r="10" fill="#8b5cf6" />
  <text x="75" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Apex Finance // Portfolio Intelligence Dashboard</text>
  
  <rect x="580" y="37" width="90" height="26" rx="13" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="592" y="54" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">+24.8% YTD</text>

  <rect x="680" y="37" width="80" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
  <text x="692" y="54" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">LIVE SYNC</text>

  <!-- Left: Main Chart Panel -->
  <g transform="translate(30, 95)">
    <rect width="460" height="325" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="25" y="35" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">PORTFOLIO VALUATION (REAL-TIME)</text>
    <text x="25" y="68" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">$142,850.40</text>
    <text x="200" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#10b981">+ $12,420 (30d)</text>

    <!-- Chart Grid Lines -->
    <line x1="25" y1="120" x2="435" y2="120" stroke="#334155" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <line x1="25" y1="170" x2="435" y2="170" stroke="#334155" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <line x1="25" y1="220" x2="435" y2="220" stroke="#334155" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <line x1="25" y1="270" x2="435" y2="270" stroke="#334155" stroke-dasharray="4 4" stroke-opacity="0.5" />

    <!-- Area Fill -->
    <path d="M 25 260 Q 90 240, 140 210 T 230 190 T 310 140 T 380 150 T 435 110 L 435 290 L 25 290 Z" fill="url(#areaGrad)" />
    <!-- Spline Stroke -->
    <path d="M 25 260 Q 90 240, 140 210 T 230 190 T 310 140 T 380 150 T 435 110" fill="none" stroke="#8b5cf6" stroke-width="3" />
    
    <!-- Active Point Highlight -->
    <circle cx="435" cy="110" r="5" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" filter="url(#glow)" />

    <!-- Time Labels -->
    <text x="30" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">JAN</text>
    <text x="110" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">MAR</text>
    <text x="190" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">MAY</text>
    <text x="270" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">JUL</text>
    <text x="350" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">SEP</text>
    <text x="415" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#8b5cf6">NOW</text>
  </g>

  <!-- Right: Metrics & Assets -->
  <g transform="translate(510, 95)">
    <!-- KPI 1 -->
    <rect width="260" height="95" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">MONTHLY REVENUE</text>
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">$28,450.00</text>
    <text x="20" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#10b981">↑ 18.2% vs previous period</text>

    <!-- KPI 2: Asset Allocation -->
    <rect y="110" width="260" height="105" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">ASSET ALLOCATION</text>
    
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="120" height="8" rx="4" fill="#8b5cf6" />
      <rect x="125" y="0" width="60" height="8" rx="4" fill="#6366f1" />
      <rect x="190" y="0" width="30" height="8" rx="4" fill="#10b981" />
    </g>
    
    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#c4b5fd">■ Equities (55%)</text>
    <text x="110" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#818cf8">■ Fixed (30%)</text>
    <text x="185" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">■ Cash (15%)</text>

    <!-- KPI 3: Tech Stack Badge -->
    <rect y="230" width="260" height="95" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="255" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">UI ARCHITECTURE</text>
    <text x="20" y="280" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">React + Tailwind + Vite</text>
    <text x="20" y="302" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">95+ Lighthouse Performance</text>
  </g>
</svg>
