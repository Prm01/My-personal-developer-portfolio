<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b0f19" />
      <stop offset="100%" stopColor="#111827" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ef4444" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#f59e0b" stopOpacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="none" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="2" />

  <!-- Grid pattern overlay -->
  <g opacity="0.15" stroke="#8b5cf6" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Top Navigation / Status Bar -->
  <rect x="25" y="25" width="750" height="50" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <circle cx="55" cy="50" r="10" fill="#8b5cf6" />
  <text x="75" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">RAHAT // Delhi Flood &amp; Heat Risk Command</text>
  
  <rect x="520" y="37" width="105" height="26" rx="13" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
  <circle cx="533" cy="50" r="4" fill="#ef4444" />
  <text x="543" y="54" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">290 WARDS LIVE</text>

  <rect x="635" y="37" width="125" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
  <text x="647" y="54" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">AWS Bedrock + MCP</text>

  <!-- Left Map / Heat Hazard Panel -->
  <rect x="25" y="90" width="460" height="335" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
  
  <!-- Stylized Ward Polygons -->
  <g transform="translate(45, 110)">
    <polygon points="120,40 180,30 220,70 190,120 130,110" fill="#8b5cf6" fill-opacity="0.4" stroke="#a78bfa" stroke-width="1.5" />
    <polygon points="190,120 250,110 280,160 230,200 170,180" fill="#ef4444" fill-opacity="0.5" stroke="#f87171" stroke-width="1.5" />
    <polygon points="60,90 120,80 130,150 70,170" fill="#f59e0b" fill-opacity="0.4" stroke="#fbbf24" stroke-width="1.5" />
    <polygon points="130,150 170,180 160,250 100,240" fill="#10b981" fill-opacity="0.4" stroke="#34d399" stroke-width="1.5" />
    <polygon points="230,200 300,190 320,250 250,270 200,240" fill="#8b5cf6" fill-opacity="0.5" stroke="#a78bfa" stroke-width="1.5" />
    <polygon points="280,60 340,50 360,110 310,130 250,110" fill="#f59e0b" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1.5" />

    <!-- Pulse indicator on Ward 142 -->
    <circle cx="215" cy="155" r="18" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6" />
    <circle cx="215" cy="155" r="8" fill="#ef4444" filter="url(#glow)" />
    
    <!-- Info tooltip -->
    <rect x="235" y="130" width="160" height="60" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="245" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Ward 142: Yamuna Belt</text>
    <text x="245" y="166" font-family="system-ui, sans-serif" font-size="10" fill="#f87171">Hazard Level: Critical (Flood)</text>
    <text x="245" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Alert: Web Push Dispatched</text>
  </g>

  <!-- Right Metrics Column -->
  <rect x="505" y="90" width="270" height="100" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="525" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">INCIDENT RESPONSE TIME</text>
  <text x="525" y="148" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#a78bfa">&lt; 850 ms</text>
  <text x="525" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">✓ 35 e2e test suites passing</text>

  <rect x="505" y="205" width="270" height="105" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="525" y="230" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">AWS INFRASTRUCTURE</text>
  <g transform="translate(525, 245)">
    <rect x="0" y="0" width="65" height="22" rx="4" fill="#334155" />
    <text x="10" y="15" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">Bedrock</text>
    <rect x="75" y="0" width="70" height="22" rx="4" fill="#334155" />
    <text x="83" y="15" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">PostgreSQL</text>
    <rect x="155" y="0" width="60" height="22" rx="4" fill="#334155" />
    <text x="165" y="15" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">CloudFront</text>
    <rect x="0" y="28" width="55" height="22" rx="4" fill="#334155" />
    <text x="8" y="43" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">RDS / S3</text>
    <rect x="65" y="28" width="70" height="22" rx="4" fill="#334155" />
    <text x="73" y="43" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">Rekognition</text>
    <rect x="145" y="28" width="70" height="22" rx="4" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1" />
    <text x="155" y="43" font-family="system-ui, sans-serif" font-size="10" fill="#c4b5fd">MCP Server</text>
  </g>

  <rect x="505" y="325" width="270" height="100" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="525" y="350" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">REAL-TIME ALERT PIPELINE</text>
  <path d="M525 395 Q 555 375, 585 390 T 645 370 T 705 385 T 750 365" fill="none" stroke="#8b5cf6" stroke-width="2.5" />
  <circle cx="750" cy="365" r="4" fill="#8b5cf6" filter="url(#glow)" />
  <text x="525" y="414" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Automated Web Push • 290 wards sync</text>
</svg>
